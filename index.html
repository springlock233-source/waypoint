<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waypoint 路书</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#E9EEF2; --ink:#182230; --muted:#5F6E7C;
  --line:#D5DDE4; --accent:#0F6E8C; --accent-ink:#FFFFFF; --accent-soft:#DDEFF5;
  --amber:#D9961E; --amber-soft:#FBEFD6; --good:#2E8B57; --good-soft:#DCF2E5; --bad:#B54141; --bad-soft:#F6DEDE;
  --ghost:#B5C2CC; --shadow:0 1px 2px rgba(24,34,48,.06),0 6px 20px rgba(24,34,48,.06);
  --sans:"Manrope","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --surface:#171F27; --surface-2:#1F2932; --ink:#E5ECF2; --muted:#95A5B3;
    --line:#2A3641; --accent:#4DB4D3; --accent-ink:#0B1218; --accent-soft:#133440;
    --amber:#E5AE45; --amber-soft:#3A2E14; --good:#57B37F; --good-soft:#153524; --bad:#D96B6B; --bad-soft:#3D1D1D;
    --ghost:#3E4C58; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --surface:#171F27; --surface-2:#1F2932; --ink:#E5ECF2; --muted:#95A5B3;
  --line:#2A3641; --accent:#4DB4D3; --accent-ink:#0B1218; --accent-soft:#133440;
  --amber:#E5AE45; --amber-soft:#3A2E14; --good:#57B37F; --good-soft:#153524; --bad:#D96B6B; --bad-soft:#3D1D1D;
  --ghost:#3E4C58; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted)}
.trip-title{border:none;background:transparent;font-weight:700;font-size:16px;padding:4px 6px;border-radius:6px;flex:1;min-width:160px}
.trip-title:hover{background:var(--surface-2)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.tab{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab .k{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab.active .k{border-color:var(--accent);color:var(--accent)}
.topbar .active-plan{font-size:12px;color:var(--muted)}
.topbar .active-plan b{color:var(--ink)}

.view{display:none;padding:20px;max-width:1500px;margin:0 auto}
.view.on{display:block}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.go{background:var(--good-soft);color:var(--good)}
.chip.skip{background:var(--bad-soft);color:var(--bad)}
.chip.tbd{background:var(--amber-soft);color:var(--amber)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.section-head p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
.hint{font-size:12px;color:var(--muted)}

/* ---------- tree view ---------- */
.tree-layout{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.tree-scroll{overflow:auto;padding:16px;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/40px 40px,var(--surface);
  background-blend-mode:normal;border:1px solid var(--line);border-radius:10px;min-height:420px}
.tree-canvas{position:relative}
.tree-canvas svg{position:absolute;inset:0;overflow:visible}
.tnode{position:absolute;width:210px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,transform .15s}
.tnode:hover{transform:translateY(-1px)}
.tnode.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.tnode.root{border-style:solid;border-color:var(--amber)}
.tnode .tn-head{display:flex;align-items:center;gap:8px}
.tnode .step{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:1px 5px}
.tnode.on .step{background:var(--accent);color:var(--accent-ink)}
.tnode .name{font-weight:700;flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.tnode.on .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tnode .tn-edge{display:flex;gap:6px;margin-top:8px}
.tnode .tn-edge select,.tnode .tn-edge input{padding:3px 6px;font-size:12px;border-radius:5px}
.tnode .tn-edge input{width:64px}
.tnode .tn-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.tnode .tn-foot .days{font-size:12px;color:var(--muted);white-space:nowrap}
.edge-label{font-family:var(--mono);font-size:11px;fill:var(--ink)}
.edge-bg{fill:var(--surface);stroke:var(--line)}
.edge{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:5 4}
.edge.on{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:none}
.compare{display:flex;flex-direction:column;gap:10px}
.plan{padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border-width:1.5px}
.plan.on{border-color:var(--accent);background:var(--accent-soft)}
.plan .route{font-weight:700;font-size:13px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.plan .route .arrow{color:var(--muted);font-weight:400}
.plan .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan .metric b{display:block;font-family:var(--mono);font-size:15px;font-weight:500}
.plan .metric span{font-size:11px;color:var(--muted)}
.plan .adopt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}

/* ---------- planner view ---------- */
.planner{display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:16px;align-items:start}
.panel{padding:14px}
.panel h3{font-size:13px;font-weight:800;letter-spacing:.02em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.stop-list{display:flex;flex-direction:column;gap:0}
.stop{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 0}
.stop .dot{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:11px;display:grid;place-items:center;font-weight:500;margin-top:2px}
.stop.origin .dot{background:var(--amber)}
.stop .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.stop .title{display:flex;justify-content:space-between;align-items:center;gap:6px}
.stop .title b{font-size:14px}
.stop .sub{font-size:12px;color:var(--muted)}
.stop .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stop .ctrls input,.stop .ctrls select{padding:4px 6px;font-size:12px}
.leg{display:grid;grid-template-columns:24px 1fr;gap:10px}
.leg .rail{display:flex;justify-content:center}
.leg .rail i{width:2px;background:var(--line);min-height:52px;display:block}
.leg .box{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.leg .box .row{gap:6px}
.leg select,.leg input{padding:4px 6px;font-size:12px}
.leg input{width:74px}
.leg .est{font-size:12px;color:var(--muted)}
.mapwrap{padding:12px}
.map{width:100%;aspect-ratio:16/11;max-width:100%;display:block;background:var(--surface-2);border-radius:8px}
.map .grid{stroke:var(--line);stroke-width:1}
.map .route{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.map .alt{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:4 4}
.map .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.map .pt.origin{fill:var(--amber)}
.map .pt.ghost{fill:var(--ghost);stroke:none}
.map .lbl{font-size:12px;font-weight:700;fill:var(--ink);font-family:var(--sans)}
.map .lbl.ghost{fill:var(--muted);font-weight:500}
.map .n{font-family:var(--mono);font-size:9px;fill:var(--accent-ink);text-anchor:middle;font-weight:500}
.map .leglbl{font-family:var(--mono);font-size:10px;fill:var(--ink);text-anchor:middle}
.map .leglbl-bg{fill:var(--surface);opacity:.92}
.map-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--mono);font-size:18px;font-weight:500}
.stats div span{font-size:11px;color:var(--muted)}
.sum-stop{padding:10px 0;border-top:1px solid var(--line)}
.sum-stop:first-child{border-top:none;padding-top:0}
.sum-stop .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum-stop .h b{font-size:14px}
.sum-stop ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:3px}
.sum-stop li{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sum-stop li.skip{color:var(--muted);text-decoration:line-through}
.sum-stop li .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--bad)}

/* ---------- stop detail ---------- */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.detail-head h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.detail-head .coords{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stop-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stop-nav .btn.on{border-color:var(--accent);color:var(--accent)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.attr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.attr{overflow:hidden;display:flex;flex-direction:column}
.attr .img{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);position:relative;display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden}
.attr .img img{width:100%;height:100%;object-fit:cover;display:block}
.attr .img label{position:absolute;right:8px;bottom:8px}
.attr .img input[type=file]{display:none}
.attr .ab{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.attr .ab input,.attr .ab textarea{border-color:transparent;background:transparent;padding:2px 4px;border-radius:4px}
.attr .ab input:hover,.attr .ab textarea:hover{background:var(--surface-2)}
.attr .ab input.name{font-weight:700;font-size:15px}
.attr .ab textarea{resize:vertical;min-height:52px;font-size:13px;line-height:1.45}
.attr .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.attr .meta input{width:56px;text-align:right;font-family:var(--mono)}
.attr .decide{display:flex;gap:6px;margin-top:auto}
.dbtn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px;font-weight:700;font-size:12px}
.dbtn.go.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dbtn.skip.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.attr.skip{opacity:.55}
.attr.go{border-color:var(--good)}
.add-attr{padding:14px;display:flex;flex-direction:column;gap:10px;border-style:dashed}
.side-info{padding:14px;display:flex;flex-direction:column;gap:10px}
.side-info textarea{min-height:90px;resize:vertical}
.side-info .kv{display:flex;justify-content:space-between;font-size:13px}
.side-info .kv b{font-family:var(--mono);font-weight:500}

/* ---------- summary (print) ---------- */
.summary-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px 44px;max-width:900px;margin:0 auto;box-shadow:var(--shadow)}
.sheet .masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.sheet .masthead h1{font-size:32px;font-weight:800;letter-spacing:-.025em}
.sheet .masthead .sub{color:var(--muted);font-size:13px}
.sheet .strip{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin-bottom:20px}
.sheet .strip .s{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.sheet .strip .s i{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:11px;font-style:normal;display:grid;place-items:center}
.sheet .strip .s.origin i{background:var(--amber)}
.sheet .strip .l{display:inline-flex;flex-direction:column;align-items:center;padding:0 10px;font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.2}
.sheet .strip .l:before{content:"";display:block;width:56px;height:2px;background:var(--line);margin-bottom:3px}
.sheet .totals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.sheet .totals div{border-top:1px solid var(--line);padding-top:8px}
.sheet .totals b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.sheet .totals span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sheet .day{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--line);break-inside:avoid}
.sheet .day .when{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
.sheet .day .when b{display:block;font-size:20px;color:var(--ink);font-weight:500;font-family:var(--sans)}
.sheet .day h3{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet .arrive{font-size:12px;color:var(--muted);margin-bottom:10px}
.sheet .picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sheet .pick{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.sheet .pick .th{width:64px;height:48px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.sheet .pick .th img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .pick b{font-size:13px;display:block}
.sheet .pick p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet .pick .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sheet .none{font-size:12px;color:var(--muted);font-style:italic}
.sheet .note{margin-top:8px;font-size:12px;color:var(--muted);white-space:pre-wrap}
.sheet .foot{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:100%;max-width:440px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:16px;font-weight:800}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:6px;padding:5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow)}

@media (max-width:1100px){
  .planner{grid-template-columns:1fr 1fr}
  .planner .col-map{grid-column:1/-1;order:-1}
}
@media (max-width:900px){
  .tree-layout,.planner,.detail-grid{grid-template-columns:1fr}
  .sheet{padding:24px 18px}
  .sheet .totals{grid-template-columns:repeat(2,1fr)}
  .sheet .day{grid-template-columns:1fr;gap:6px}
}
@media (max-width:600px){
  .view{padding:12px 16px}
  .topbar{padding:8px 16px}
  .tab span.t{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{margin:14mm}
  body{background:#fff;color:#111}
  .topbar,.summary-tools,.view:not(#v-summary){display:none!important}
  #v-summary{display:block!important;padding:0}
  .sheet{border:none;box-shadow:none;padding:0;max-width:none;background:#fff}
  .sheet .day{break-inside:avoid}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Waypoint <small>路书</small></div>
  <input id="trip-title" class="trip-title" aria-label="行程名称">
  <nav class="tabs" id="tabs">
    <button class="tab" data-view="tree"><span class="k">1</span><span class="t">路线树</span></button>
    <button class="tab" data-view="plan"><span class="k">2</span><span class="t">行程与地图</span></button>
    <button class="tab" data-view="detail"><span class="k">3</span><span class="t">站点景点</span></button>
    <button class="tab" data-view="summary"><span class="k">4</span><span class="t">总结导出</span></button>
  </nav>
  <div class="active-plan" id="active-plan"></div>
</header>

<section class="view" id="v-tree"></section>
<section class="view" id="v-plan"></section>
<section class="view" id="v-detail"></section>
<section class="view" id="v-summary"></section>
<div id="modal-root"></div>

<script>
/* ============ data ============ */
const MODES = {
  drive:{label:'驾车',icon:'🚗',kmh:85,factor:1.35,overhead:0,gm:'driving'},

let state = sampleState();

/* ============ helpers ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const place = id => state.places[id];
const node = id => state.nodes[id];
function haversine(a,b){
  const R=6371, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* ---- straight-line fallback estimate ----
   Short drives wind more and run slower than long expressway legs, so for driving both the
   detour factor and the speed depend on distance (calibrated against OSRM on the sample legs). */
function detour(d,mode){ return mode==='drive' ? 1.2+0.4*Math.exp(-d/200) : (MODES[mode]||MODES.drive).factor; }
function speed(d,mode){ return mode==='drive' ? 60+25*(1-Math.exp(-d/150)) : (MODES[mode]||MODES.drive).kmh; }
function estMinutes(pa,pb,mode){ const m=MODES[mode]||MODES.drive, d=haversine(pa,pb); return Math.round(d*detour(d,mode)/speed(d,mode)*60 + m.overhead); }
function estKm(pa,pb,mode){ const d=haversine(pa,pb); return Math.round(d*detour(d,mode)); }

/* ---- routed times: OSRM public server, no API key. Drive and walk legs only; other modes stay estimated. ---- */
const OSRM='https://router.project-osrm.org';
const ROUTE_PROFILE={drive:'driving',walk:'foot'};
const routeCache={};   // key -> {minutes,km} | 'pending' | 'error'
const routeKey=(a,b,mode)=>`${ROUTE_PROFILE[mode]}|${a.lat},${a.lng}|${b.lat},${b.lng}`;
function routeState(n){ if(!n.parentId||!ROUTE_PROFILE[n.mode]) return null; return routeCache[routeKey(place(node(n.parentId).placeId),place(n.placeId),n.mode)]||null; }
function routed(n){ const r=routeState(n); return r&&typeof r==='object'?r:null; }
function edgeSource(n){ return (n.minutes!=null&&n.minutes!=='')?'manual':routed(n)?'routed':'est'; }
const routeQueue=[]; let routing=false, routeRender=null;
function requestRoutes(){   // called after every render; queues any routable edge not yet in the cache
  Object.values(state.nodes).forEach(n=>{ if(!n.parentId||!ROUTE_PROFILE[n.mode]) return;
    const a=place(node(n.parentId).placeId), b=place(n.placeId), k=routeKey(a,b,n.mode);
    if(routeCache[k]) return; routeCache[k]='pending'; routeQueue.push({k,a,b,mode:n.mode}); });
  if(!routing&&routeQueue.length) drainRoutes();
}
async function drainRoutes(){ routing=true;
  while(routeQueue.length){ const {k,a,b,mode}=routeQueue.shift();
    try{ const res=await fetch(`${OSRM}/route/v1/${ROUTE_PROFILE[mode]}/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`);
      const rt=(await res.json()).routes?.[0];
      routeCache[k]=rt?{minutes:Math.round(rt.duration/60),km:Math.round(rt.distance/1000)}:'error';
    }catch(_){ routeCache[k]='error'; }
    // re-render (without scrolling) once responses settle, but never while the user is typing in a field
    clearTimeout(routeRender); routeRender=setTimeout(()=>{ if(!document.activeElement?.matches('input,textarea,select')) render(true); },250);
  }
  routing=false;
}
function autoMinutes(n){ const r=routed(n); return r?r.minutes:estMinutes(place(node(n.parentId).placeId),place(n.placeId),n.mode); }
function edgeMinutes(n){
  if(!n.parentId) return 0;
  if(n.minutes!=null && n.minutes!=='') return Number(n.minutes);
  return autoMinutes(n);
}
function edgeKm(n){ if(!n.parentId) return 0; const r=routed(n); return r?r.km:estKm(place(node(n.parentId).placeId),place(n.placeId),n.mode); }
function legSourceText(n){ const s=edgeSource(n), r=routed(n), km=edgeKm(n);
  if(s==='manual') return `手动 ${fmtMin(edgeMinutes(n))} · ${km} km${r?` · 公路路线约 ${fmtMin(r.minutes)} <button type="button" class="btn small ghost" data-auto="${n.id}">改用路线时间</button>`:''}`;
  if(s==='routed') return `公路路线 ${fmtMin(r.minutes)} · ${km} km`;
  return `${routeState(n)==='pending'?'路线计算中…':'直线估算*'} ${fmtMin(edgeMinutes(n))} · 约 ${km} km`;
}
function fmtMin(m){ m=Math.round(m); const h=Math.floor(m/60), mm=m%60; return h? `${h}h${mm?String(mm).padStart(2,'0'):''}` : `${mm}min`; }
function pathTo(id){ const p=[]; let n=node(id); while(n){ p.unshift(n.id); n=n.parentId?node(n.parentId):null; } return p; }
const activePath = () => pathTo(state.activeLeafId);
function leaves(){ return Object.values(state.nodes).filter(n=>!n.children.length).map(n=>n.id); }
function metrics(pathIds){
  let travel=0,km=0,days=0,go=0,tbd=0,hours=0;
  pathIds.forEach(id=>{ const n=node(id), p=place(n.placeId); travel+=edgeMinutes(n); km+=edgeKm(n); days+=Number(p.days)||0;
    p.attractions.forEach(a=>{ if(a.decision==='go'){go++;hours+=Number(a.hours)||0;} if(a.decision==='tbd') tbd++; }); });
  return {travel,km,days,go,tbd,hours,stops:pathIds.length-1};
}
function gmapsLink(pathIds){
  const pts=pathIds.map(id=>place(node(id).placeId)); if(pts.length<2) return `https://www.google.com/maps/search/?api=1&query=${pts[0].lat},${pts[0].lng}`;
  const o=pts[0], d=pts[pts.length-1], w=pts.slice(1,-1).map(p=>`${p.lat},${p.lng}`).join('|');
  const modes=pathIds.slice(1).map(id=>node(id).mode); const tm = modes.every(m=>m==='walk')?'walking': modes.every(m=>['train','bus','boat'].includes(m))?'transit':'driving';
  return `https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}${w?`&waypoints=${encodeURIComponent(w)}`:''}&travelmode=${tm}`;
}
const amapLink = p => `https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${encodeURIComponent(p.name)}`;
const placeLink = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
function decisionChip(d){ return d==='go'?'<span class="chip go">去</span>':d==='skip'?'<span class="chip skip">不去</span>':'<span class="chip tbd">待定</span>'; }
function modeOptions(sel){ return Object.entries(MODES).map(([k,m])=>`<option value="${k}" ${k===sel?'selected':''}>${m.icon} ${m.label}</option>`).join(''); }
let toastT; function toast(msg){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),1800); }

/* ============ mutations ============ */
function addNode(parentId,placeId,mode='drive'){ const n={id:uid('n'),placeId,parentId,mode,minutes:null,children:[]}; state.nodes[n.id]=n; node(parentId).children.push(n.id); state.activeLeafId=n.id; return n; }
function deleteSubtree(id){
  const n=node(id); if(!n.parentId) return;
  const all=[]; (function walk(x){ all.push(x); node(x).children.forEach(walk); })(id);
  if(all.includes(state.activeLeafId)) state.activeLeafId=n.parentId;
  const par=node(n.parentId); par.children=par.children.filter(c=>c!==id);
  all.forEach(x=>delete state.nodes[x]);
}
function spliceNode(id){ // remove one stop, keep what follows
  const n=node(id); if(!n.parentId) return;
  const par=node(n.parentId); const idx=par.children.indexOf(id);
  par.children.splice(idx,1,...n.children); n.children.forEach(c=>node(c).parentId=par.id);
  if(state.activeLeafId===id) state.activeLeafId=par.id;
  delete state.nodes[id];
}
function createPlace(name,lat,lng,days){ const p={id:uid('p'),name,lat:Number(lat),lng:Number(lng),days:Number(days)||1,note:'',attractions:[]}; state.places[p.id]=p; return p; }

/* ============ render ============ */
function render(quiet){   // quiet: re-render in place (routed times arrived) without jumping to the top
  document.getElementById('trip-title').value=state.title;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===state.view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+state.view));
  const ap=activePath(), m=metrics(ap);
  document.getElementById('active-plan').innerHTML=`当前方案 <b>${ap.map(id=>esc(place(node(id).placeId).name.split(' ')[0])).join(' → ')}</b> · ${m.days} 晚 · 在途 ${fmtMin(m.travel)}`;
  ({tree:renderTree,plan:renderPlan,detail:renderDetail,summary:renderSummary})[state.view]();
  if(!quiet) window.scrollTo({top:0});
  requestRoutes();
}

/* ---- 1. tree ---- */
function renderTree(){
  const COLW=290, ROWH=150, W=210, H=112;
  const pos={}; let row=0, maxD=0;
  (function dfs(id,d){ const n=node(id); maxD=Math.max(maxD,d);
    if(!n.children.length){ pos[id]={x:d,y:row++}; return pos[id].y; }
    const ys=n.children.map(c=>dfs(c,d+1)); pos[id]={x:d,y:(Math.min(...ys)+Math.max(...ys))/2}; return pos[id].y; })(state.rootId,0);
  const ap=new Set(activePath());
  const cw=maxD*COLW+W+16, ch=(Math.max(row,1)-1)*ROWH+H+16;
  let svg='', boxes='';
  Object.keys(pos).forEach(id=>{
    const n=node(id), p=place(n.placeId), x=pos[id].x*COLW, y=pos[id].y*ROWH, on=ap.has(id);
    if(n.parentId){
      const pp=pos[n.parentId], x1=pp.x*COLW+W, y1=pp.y*ROWH+H/2, x2=x, y2=y+H/2, mx=(x1+x2)/2;
      const onEdge = on && ap.has(n.parentId);
      svg+=`<path class="edge ${onEdge?'on':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
      const lbl=`${MODES[n.mode].icon} ${fmtMin(edgeMinutes(n))}${edgeSource(n)==='est'?'*':''}`; const lw=lbl.length*7.5+14;
      svg+=`<rect class="edge-bg" x="${mx-lw/2}" y="${(y1+y2)/2-11}" width="${lw}" height="22" rx="11"/><text class="edge-label" x="${mx}" y="${(y1+y2)/2+4}" text-anchor="middle">${esc(lbl)}</text>`;
    }
    const depth=pos[id].x;
    boxes+=`<div class="tnode ${on?'on':''} ${n.parentId?'':'root'}" style="left:${x}px;top:${y}px;height:${H}px" data-node="${id}">
      <div class="tn-head"><span class="step">${depth===0?'起点':'第'+depth+'站'}</span><span class="name">${esc(p.name)}</span><span class="check">✓</span></div>
      ${n.parentId?`<div class="tn-edge" data-stop><select data-mode="${id}" aria-label="交通方式">${modeOptions(n.mode)}</select><input type="number" min="0" data-min="${id}" value="${n.minutes??''}" placeholder="${autoMinutes(n)} 自动" aria-label="分钟"></div>`:`<div class="tn-edge muted" style="font-size:12px;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">始发地${p.note?' · '+esc(p.note):''}</div>`}
      <div class="tn-foot"><span class="days">${p.days} 天 · ${p.attractions.filter(a=>a.decision==='go').length}/${p.attractions.length} 景点</span>
        <span class="row" style="gap:2px" data-stop><button class="btn small ghost" data-add="${id}" title="添加下一站分支">＋ 分支</button>${n.parentId?`<button class="btn small ghost danger" data-del="${id}" title="删除此分支">×</button>`:''}</span></div>
    </div>`;
  });
  const plans=leaves().map(l=>pathTo(l));
  const v=document.getElementById('v-tree');
  v.innerHTML=`
  <div class="section-head"><h2>路线树 · 分岔与选择</h2><p>每个方框是一个可能的站点，从起点向右分岔。点击任一方框，起点到它的这条路径就成为「当前方案」，其余页面都会随之更新。驾车时间默认按真实公路路线计算（OSRM）；带 * 的是路线暂时拿不到时的直线估算。都可以手动改。</p></div>
  <div class="tree-layout">
    <div class="tree-scroll"><div class="tree-canvas" style="width:${cw}px;height:${ch}px"><svg width="${cw}" height="${ch}">${svg}</svg>${boxes}</div></div>
    <div>
      <div class="section-head" style="margin-bottom:8px"><h2 style="font-size:14px">完整路线对比</h2><span class="hint">${plans.length} 条</span></div>
      <div class="compare">${plans.map(p=>{ const m=metrics(p), on=p[p.length-1]===state.activeLeafId;
        return `<div class="card plan ${on?'on':''}" data-adopt="${p[p.length-1]}">
          <div class="route">${p.map((id,i)=>`${i?'<span class="arrow">→</span>':''}<span>${esc(place(node(id).placeId).name.split(' ')[0])}</span>`).join('')}</div>
          <div class="metrics"><div class="metric"><b>${m.days}</b><span>晚</span></div><div class="metric"><b>${fmtMin(m.travel)}</b><span>在途 · ${Math.round(m.km)} km</span></div><div class="metric"><b>${m.go}<span style="font-size:11px;color:var(--muted)">+${m.tbd}?</span></b><span>已选景点 · 待定</span></div></div>
          <div class="adopt"><span class="check" style="width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;${on?'background:var(--accent);border-color:var(--accent);color:var(--accent-ink)':'color:transparent'}">✓</span>${on?'当前采用的方案':'点击采用这条路线'}</div>
        </div>`;}).join('')}</div>
      <p class="hint" style="margin-top:12px">提示：驾车 / 步行时间来自 OSRM 公路路线（不含堵车），火车、大巴、飞机、船按平均速度估算，飞机含 2.5 小时机场时间。节假日路况请到高德 / 百度再核对。</p>
    </div>
  </div>`;
}

/* ---- 2. planner ---- */
function renderPlan(){
  const ap=activePath(), m=metrics(ap);
  const all=Object.values(state.places).filter(p=>Object.values(state.nodes).some(n=>n.placeId===p.id));
  // projection
  const lats=all.map(p=>p.lat), lngs=all.map(p=>p.lng);
  const midLat=(Math.max(...lats)+Math.min(...lats))/2, k=Math.cos(midLat*Math.PI/180);
  const VW=800,VH=550,PAD=70;
  const minX=Math.min(...lngs)*k, maxX=Math.max(...lngs)*k, minY=Math.min(...lats), maxY=Math.max(...lats);
  const spanX=Math.max(maxX-minX,0.2), spanY=Math.max(maxY-minY,0.2);
  const sc=Math.min((VW-2*PAD)/spanX,(VH-2*PAD)/spanY);
  const ox=(VW-spanX*sc)/2, oy=(VH-spanY*sc)/2;
  const X=p=>ox+(p.lng*k-minX)*sc, Y=p=>VH-(oy+(p.lat-minY)*sc);
  let grid=''; for(let i=1;i<10;i++){ grid+=`<line class="grid" x1="${VW*i/10}" y1="0" x2="${VW*i/10}" y2="${VH}"/>`; } for(let i=1;i<7;i++){ grid+=`<line class="grid" x1="0" y1="${VH*i/7}" x2="${VW}" y2="${VH*i/7}"/>`; }
  const apSet=new Set(ap); let alt='',route='',legs='',pts='';
  Object.values(state.nodes).forEach(n=>{ if(!n.parentId) return; const a=place(node(n.parentId).placeId), b=place(n.placeId);
    const on=apSet.has(n.id)&&apSet.has(n.parentId);
    if(on){ route+=`<line class="route" x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"/>`;
      const mx=(X(a)+X(b))/2,my=(Y(a)+Y(b))/2, t=`${MODES[n.mode].icon} ${fmtMin(edgeMinutes(n))}`; legs+=`<rect class="leglbl-bg" x="${mx-t.length*3.6-6}" y="${my-9}" width="${t.length*7.2+12}" height="18" rx="9"/><text class="leglbl" x="${mx}" y="${my+4}">${esc(t)}</text>`; }
    else alt+=`<line class="alt" x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"/>`; });
  const onPlaces=new Set(ap.map(id=>node(id).placeId));
  all.forEach(p=>{ if(!onPlaces.has(p.id)) pts+=`<circle class="pt ghost" cx="${X(p)}" cy="${Y(p)}" r="4"/><text class="lbl ghost" x="${X(p)+8}" y="${Y(p)-6}">${esc(p.name.split(' ')[0])}</text>`; });
  ap.forEach((id,i)=>{ const p=place(node(id).placeId); pts+=`<circle class="pt ${i?'':'origin'}" cx="${X(p)}" cy="${Y(p)}" r="9"/><text class="n" x="${X(p)}" y="${Y(p)+3.5}">${i||'S'}</text><text class="lbl" x="${X(p)+13}" y="${Y(p)-8}">${esc(p.name.split(' ')[0])}</text>`; });

  const v=document.getElementById('v-plan');
  v.innerHTML=`
  <div class="planner">
    <div class="card panel col-left">
      <h3>站点与交通 <button class="btn small primary" data-add="${ap[ap.length-1]}">＋ 添加站点</button></h3>
      <div class="stop-list">
      ${ap.map((id,i)=>{ const n=node(id), p=place(n.placeId); return `
        ${i?`<div class="leg"><div class="rail"><i></i></div><div class="box">
          <div class="row"><select data-mode="${id}" aria-label="交通方式">${modeOptions(n.mode)}</select><input type="number" min="0" data-min="${id}" value="${n.minutes??''}" placeholder="${autoMinutes(n)}" aria-label="分钟"><span class="hint">分钟</span></div>
          <div class="est">${legSourceText(n)}</div></div></div>`:''}
        <div class="stop ${i?'':'origin'}"><div class="dot">${i||'S'}</div><div class="body">
          <div class="title"><b>${esc(p.name)}</b><span class="row" style="gap:2px"><button class="btn small ghost" data-goto="${p.id}">景点 ›</button>${i?`<button class="btn small ghost danger" data-splice="${id}" title="从当前方案移除">×</button>`:''}</span></div>
          <div class="ctrls"><label class="field"><span class="hint">停留天数</span><input type="number" min="0" step="0.5" data-days="${p.id}" value="${p.days}"></label><label class="field"><span class="hint">地图</span><span class="row" style="gap:4px"><a class="btn small" href="${amapLink(p)}" target="_blank" rel="noopener">高德</a><a class="btn small" href="${placeLink(p)}" target="_blank" rel="noopener">Google</a></span></label></div>
          <div class="sub">${esc(p.note||'')}</div>
        </div></div>`; }).join('')}
      </div>
    </div>
    <div class="card mapwrap col-map">
      <svg class="map" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="路线示意地图">${grid}${alt}${route}${pts}${legs}</svg>
      <div class="map-foot">
        <div class="stats"><div><b>${m.stops}</b><span>中途站点</span></div><div><b>${m.days}</b><span>晚</span></div><div><b>${fmtMin(m.travel)}</b><span>在途时间</span></div><div><b>${Math.round(m.km)}</b><span>里程 km</span></div></div>
        <a class="btn primary" href="${gmapsLink(ap)}" target="_blank" rel="noopener">在 Google 地图打开整条路线 ↗</a>
      </div>
      <p class="hint" style="margin:8px 0 0">示意图按经纬度等比例绘制，虚线是路线树里未采用的分支。里程和驾车时间来自 OSRM 公路路线；路况和时刻表请点上面按钮到 Google 地图查看。</p>
    </div>
    <div class="card panel col-right">
      <h3>方案总览 <span class="hint">${m.go} 个景点 · 约 ${m.hours} 小时</span></h3>
      ${ap.map((id,i)=>{ const p=place(node(id).placeId); const go=p.attractions.filter(a=>a.decision==='go'); const hrs=go.reduce((s,a)=>s+(Number(a.hours)||0),0); const cap=(Number(p.days)||0)*8; const pct=cap?Math.min(100,hrs/cap*100):0;
        return `<div class="sum-stop"><div class="h"><b>${i?i+'. ':''}${esc(p.name.split(' ')[0])}</b><span class="hint num">${p.days} 天 · ${hrs}h / ${cap}h</span></div>
          <div class="bar"><i class="${hrs>cap?'over':''}" style="width:${pct}%"></i></div>
          <ul>${p.attractions.length?p.attractions.map(a=>`<li class="${a.decision}">${a.decision==='go'?'✓ ':a.decision==='skip'?'– ':'? '}${esc(a.name)}<span class="t">${a.hours}h</span></li>`).join(''):'<li class="muted">还没有景点，去「站点景点」页添加</li>'}</ul></div>`; }).join('')}
      <p class="hint" style="margin-top:10px">进度条按每天 8 小时游览时间估算，红色表示已选景点超出停留天数。</p>
    </div>
  </div>`;
}

/* ---- 3. stop detail ---- */

          </div></div>`).join('')}
        <form class="card add-attr" id="add-attr">
          <b>添加景点</b>

/* ---- 4. summary ---- */
function renderSummary(){
  const ap=activePath(), m=metrics(ap);
  let day=1; const start=state.startDate?new Date(state.startDate+'T00:00:00'):null;
  const fmtDate=d=>{ if(!start) return ''; const x=new Date(start); x.setDate(x.getDate()+d-1); return `${x.getMonth()+1}/${x.getDate()}`; };
  const v=document.getElementById('v-summary');
  v.innerHTML=`
  <div class="summary-tools">
    <div class="row"><label class="field"><span>出发日期（可选，用于标注每天）</span><input type="date" id="start-date" value="${esc(state.startDate)}"></label></div>
    <div class="row"><button class="btn primary" id="btn-pdf">导出 PDF / 打印</button><span class="hint">在浏览器打印对话框里选「另存为 PDF」。</span></div>
  </div>
  <article class="sheet">
    <div class="masthead"><div><div class="eyebrow">Itinerary · 行程总结</div><h1>${esc(state.title)}</h1></div><div class="sub">${ap.length-2} 站 · ${m.days} 晚${start?` · ${fmtDate(1)} 出发`:''}</div></div>
    <div class="strip">${ap.map((id,i)=>{ const n=node(id), p=place(n.placeId); return `${i?`<span class="l"><span>${MODES[n.mode].icon} ${MODES[n.mode].label}</span><span>${fmtMin(edgeMinutes(n))}</span></span>`:''}<span class="s ${i?'':'origin'}"><i>${i||'S'}</i>${esc(p.name.split(' ')[0])}</span>`; }).join('')}</div>
    <div class="totals"><div><b>${m.days}</b><span>晚</span></div><div><b>${fmtMin(m.travel)}</b><span>在途时间</span></div><div><b>${Math.round(m.km)} km</b><span>总里程</span></div><div><b>${m.go}</b><span>已选景点 · ${m.hours}h</span></div></div>
    ${ap.map((id,i)=>{ const n=node(id), p=place(n.placeId); const nights=Number(p.days)||0, d0=day, span=nights>0?Math.ceil(nights):0, last=i===ap.length-1; day+=span;   // a 0-night stop shares its day with the next stop
      const go=p.attractions.filter(a=>a.decision==='go'), tbd=p.attractions.filter(a=>a.decision==='tbd');
      const when=(i===0&&!span)?`<b>出发</b>${start?fmtDate(d0):''}`:`<b>Day ${d0}${span>1?'–'+(d0+span-1):''}</b>${start?`${fmtDate(d0)}${span>1?' – '+fmtDate(d0+span-1):''}<br>`:''}${nights>0?p.days+' 天停留':last?'到达，行程结束':'途经，不过夜'}`;
      return `<section class="day"><div class="when">${when}</div>
        <div><h3>${i?i+'. ':''}${esc(p.name)}</h3>
        ${i?`<div class="arrive">${MODES[n.mode].icon} 从 ${esc(place(node(n.parentId).placeId).name.split(' ')[0])} ${MODES[n.mode].label}抵达 · 约 ${fmtMin(edgeMinutes(n))}</div>`:'<div class="arrive">出发地</div>'}
        ${go.length?`<div class="picks">${go.map(a=>`<div class="pick"><div class="th">${a.img?`<img src="${a.img}" alt="">`:''}</div><div><b>${esc(a.name)}</b><span class="t">${a.hours}h</span><p>${esc(a.desc)}</p></div></div>`).join('')}</div>`:'<div class="none">还没有确定要去的景点</div>'}
        ${tbd.length?`<div class="note">待定：${tbd.map(a=>esc(a.name)).join('、')}</div>`:''}
        ${p.note?`<div class="note">${esc(p.note)}</div>`:''}
        </div></section>`; }).join('')}
    <div class="foot"><span>Waypoint 路书 · 时间为估算，以实际时刻表为准</span><span>${new Date().toLocaleDateString('zh-CN')}</span></div>

}

/* ============ modal ============ */
function openAddStop(parentId){
  const parent=node(parentId), pp=place(parent.placeId);
  const existing=Object.values(state.places).filter(p=>p.id!==parent.placeId);
  const root=document.getElementById('modal-root');
  let tab=existing.length?'existing':'new';
  const draw=()=>{ root.innerHTML=`<div class="modal-bg" data-close><form class="modal" id="add-stop-form">
    <h3>在「${esc(pp.name.split(' ')[0])}」之后添加站点</h3>
    <div class="seg"><button type="button" data-tab="existing" class="${tab==='existing'?'on':''}">已有地点</button><button type="button" data-tab="new" class="${tab==='new'?'on':''}">新地点</button></div>
    ${tab==='existing'?`<label class="field"><span>选择地点</span><select id="as-place">${existing.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>`
    :`<label class="field"><span>名称</span><input id="as-name" placeholder="例：因特拉肯 Interlaken" required></label>
      <div class="grid2"><label class="field"><span>纬度 lat</span><input id="as-lat" type="number" step="any" placeholder="46.6863" required></label><label class="field"><span>经度 lng</span><input id="as-lng" type="number" step="any" placeholder="7.8632" required></label></div>
      <label class="field"><span>停留天数</span><input id="as-days" type="number" min="0" step="0.5" value="1"></label>
      <span class="hint">在 Google 地图上右键点地点即可复制经纬度。</span>`}
    <label class="field"><span>交通方式</span><select id="as-mode">${modeOptions('drive')}</select></label>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">添加</button></div>
  </form></div>`;
    root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw();});
    root.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{ if(e.target===b) root.innerHTML=''; });
    root.querySelector('#add-stop-form').onsubmit=e=>{ e.preventDefault();
      let pid; if(tab==='existing') pid=root.querySelector('#as-place').value; else pid=createPlace(root.querySelector('#as-name').value.trim(),root.querySelector('#as-lat').value,root.querySelector('#as-lng').value,root.querySelector('#as-days').value).id;
      addNode(parentId,pid,root.querySelector('#as-mode').value); root.innerHTML=''; toast('已添加站点并切换到该路线'); render(); };
    const f=root.querySelector('input,select'); f&&f.focus();
  }; draw();
}

/* ============ events ============ */
document.getElementById('tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(t){ state.view=t.dataset.view; render(); } });
document.getElementById('trip-title').addEventListener('change',e=>{ state.title=e.target.value; });
document.addEventListener('keydown',e=>{ if(e.target.matches('input,textarea,select')) return; const v={1:'tree',2:'plan',3:'detail',4:'summary'}[e.key]; if(v){state.view=v;render();} });

document.body.addEventListener('click',e=>{
  const t=e.target;
  const b=t.closest('[data-add],[data-del],[data-adopt],[data-goto],[data-splice],[data-decide],[data-adel],[data-auto],[data-view-go],[data-node]');
  if(!b) return;
  if(b.dataset.add){ openAddStop(b.dataset.add); return; }
  if(b.dataset.auto){ node(b.dataset.auto).minutes=null; toast('已改用公路路线时间'); render(); return; }
  if(b.dataset.del){ deleteSubtree(b.dataset.del); render(); return; }
  if(b.dataset.adopt){ state.activeLeafId=b.dataset.adopt; render(); return; }
  if(b.dataset.goto){ state.currentPlaceId=b.dataset.goto; state.view='detail'; render(); return; }
  if(b.dataset.splice){ spliceNode(b.dataset.splice); render(); return; }
  if(b.dataset.decide){ const a=findAttr(b.dataset.decide); a.decision=b.dataset.val; render(); return; }
  if(b.dataset.adel){ const p=place(state.currentPlaceId); p.attractions=p.attractions.filter(a=>a.id!==b.dataset.adel); render(); return; }
  if(b.dataset.viewGo){ state.view=b.dataset.viewGo; render(); return; }
  if(b.dataset.node){ if(t.closest('[data-stop]')) return; state.activeLeafId=b.dataset.node; render(); return; }
});
function findAttr(id){ for(const p of Object.values(state.places)){ const a=p.attractions.find(a=>a.id===id); if(a) return a; } }

document.body.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(d.mode){ node(d.mode).mode=t.value; render(); }
  else if(d.min){ node(d.min).minutes=t.value===''?null:Number(t.value); render(); }
  else if(d.days){ place(d.days).days=Number(t.value)||0; render(); }
  else if(d.note){ place(d.note).note=t.value; }
  else if(d.aname){ findAttr(d.aname).name=t.value; }
  else if(d.adesc){ findAttr(d.adesc).desc=t.value; }
  else if(d.ahours){ findAttr(d.ahours).hours=Number(t.value)||0; render(); }
  else if(d.img){ readImg(t.files[0]).then(src=>{ findAttr(d.img).img=src; render(); }); }
  else if(t.id==='start-date'){ state.startDate=t.value; render(); }
});
function readImg(file){ return new Promise(res=>{ if(!file) return res(null); const img=new Image(); const fr=new FileReader(); fr.onload=()=>{ img.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1,1000/Math.max(img.width,img.height)); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; img.src=fr.result; }; fr.readAsDataURL(file); }); }

document.body.addEventListener('submit',e=>{
  if(e.target.id!=='add-attr') return; e.preventDefault();
  const p=place(state.currentPlaceId); const f=e.target;
  const a={id:uid('a'),name:f.querySelector('#na-name').value.trim(),desc:f.querySelector('#na-desc').value.trim(),hours:Number(f.querySelector('#na-hours').value)||0,decision:'tbd',img:null};
  if(!a.name) return;
  readImg(f.querySelector('#na-img').files[0]).then(src=>{ a.img=src; p.attractions.push(a); toast('已添加景点'); render(); });
});
document.body.addEventListener('click',e=>{ if(e.target.id==='btn-pdf'){ try{ window.print(); }catch(_){ } } });

/* ============ boot ============ */
function start(data){ if(data&&data.nodes&&data.places){ state=data; } render(); }
window.claude?.hot?.snapshot?.(()=>state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data);
</script>
</body>
</html>
